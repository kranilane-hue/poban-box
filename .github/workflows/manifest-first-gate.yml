name: manifest-first-gate

on:
  push:
    branches:
      - ci-proof-trc001
  pull_request:
    branches:
      - main

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run manifest-first gate
        run: node tools/manifest-first-gate.js
